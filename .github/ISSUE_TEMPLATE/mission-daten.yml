name: Mission melden
description: Missionsname, Gegner und NPC-Funk, damit Canary die Mission erkennen lernt
title: "Mission: "
labels: ["mission-daten"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du dir die Zeit nimmst. Am schnellsten geht es über das
        Formular auf der Seite: dort fügst du deinen Local ein und alles außer
        den NPC-Zeilen wird automatisch entfernt, bevor irgendetwas hier
        ankommt. Von Hand geht es genauso, dann achte bitte selbst darauf,
        keine Pilotennamen mitzuschicken.

  - type: input
    id: name
    attributes:
      label: Missionsname
      description: Genau so, wie der Agent sie nennt
      placeholder: Recon (1 of 3)
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Stufe
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true

  - type: input
    id: fraktion
    attributes:
      label: Gegner-Fraktion
      placeholder: Sansha, Blood Raiders, Angel Cartel …

  - type: textarea
    id: funk
    attributes:
      label: NPC-Funk aus dem Local (falls es welchen gibt)
      description: >
        Nur die Zeilen, die mit "Message" beginnen. Die Abschluss-Zeile ist
        besonders wertvoll, etwa "The mission has been completed". Gibt es im
        Local gar nichts, lass das Feld leer und trag unten den Gegner ein:
        ein einmaliger Gegnername reicht Canary genauso.
      render: text
      placeholder: |
        Pirates have emerged from the shadows!
        Pirate Captain: They've discovered our hideout!
        The mission has been completed. Report back to your agent.

  - type: textarea
    id: gegner
    attributes:
      label: Gegner, besonders benannte
      description: >
        Die Namen aus dem Kampflog. Ein einmaliger, benannter Gegner ist das
        Wertvollste hier: an dem allein laesst sich eine Mission erkennen, auch
        wenn im Local kein Wort faellt. Bei Missionen ganz ohne Kampf einfach
        leer lassen, genau die sind auf ihre Art auch interessant.
      render: text
      placeholder: |
        Centus Beast Lord
        Centior Cannibal

  - type: textarea
    id: fingerabdruck
    attributes:
      label: Vollständige Gegnerliste (Gegner-Fingerabdruck)
      description: >
        Anders als oben: hier bitte ALLE Gegnertypen des Laufs, auch die ganz
        gewöhnlichen. Eine Mission wirft immer dieselbe Zusammenstellung
        entgegen, deshalb erkennt Canary sie daran auch dann wieder, wenn kein
        einziger Name auffällig ist und im Local nichts steht. Am einfachsten
        in Canary: Missionen-Tab, Lauf benennen, "Für alle beitragen" drücken
        und den Block hier einfügen. Ab vier Namen ist es brauchbar.
      render: text
      placeholder: |
        Federation Navy Megathron
        Federation Navy Thorax
        Federation Covinus
        Federation Navy Orion

  - type: textarea
    id: notiz
    attributes:
      label: Was ist Canary aufgefallen?
      description: >
        Wurde die Mission erkannt, gar nicht erkannt, oder falsch? Gab es
        Besonderheiten, etwa dass man nicht alle Gegner abschießen muss?
      placeholder: Wurde nicht erkannt, ich musste keinen einzigen Gegner abschießen.
