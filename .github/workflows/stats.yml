name: Stats aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden, Minute 17 um GitHubs volle-Stunde-Stau zu meiden
  workflow_dispatch: {}       # manuell ausloesbar unter Actions

permissions:
  contents: write

concurrency:
  group: stats-json
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: stats.json neu berechnen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/build_stats.py

      - name: Committen und pushen, falls geaendert
        run: |
          if git diff --quiet -- stats.json; then
            echo "unveraendert, nichts zu pushen."
            exit 0
          fi
          git config user.name "canary-stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git commit -m "Zahlen aktualisiert (automatisch)"
          git push
